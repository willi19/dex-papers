<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dex-papers · dexterous manipulation research map</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #1f232c; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #9aa3b2; --accent: #6ea8fe; --accent2: #2b8a5b;
    --chip: #262b35; --chipOn: #3a6df0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 16px 20px 12px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  h1 .count { color: var(--muted); font-weight: 400; font-size: 14px; }
  .search { width: 100%; max-width: 460px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    font-size: 14px; margin-top: 8px; }
  .search:focus { outline: none; border-color: var(--accent); }
  .barlabel { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: .04em; margin: 12px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { cursor: pointer; user-select: none; padding: 4px 10px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--border); color: var(--text);
    font-size: 12px; white-space: nowrap; }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .chip.on { background: var(--chipOn); border-color: var(--chipOn); color: #fff; }
  .chip.on .n { color: #dce6ff; }
  .chip.coll { background: #20303f; }
  .chip.coll.on { background: var(--accent2); border-color: var(--accent2); }
  .zonetoggle { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
  .zonetoggle:hover { color: var(--text); }
  .zonetoggle .caret { font-size: 9px; transition: transform .15s; display: inline-block; }
  .zonetoggle.open .caret { transform: rotate(90deg); }
  .zonetoggle .zonesummary { text-transform: none; letter-spacing: 0; color: var(--accent); }
  #filterZone.collapsed { display: none; }
  .catheads { display: flex; flex-wrap: wrap; gap: 6px; }
  .cathead { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    user-select: none; padding: 4px 11px; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--text); font-size: 12px; }
  .cathead:hover { border-color: var(--accent); }
  .cathead.open { border-color: var(--accent); background: #20262f; }
  .cathead .caret { color: var(--muted); font-size: 9px; transition: transform .15s; display: inline-block; }
  .cathead.open .caret { transform: rotate(90deg); }
  .cathead .cn { color: var(--muted); }
  .cathead .actN { background: var(--chipOn); color: #fff; border-radius: 999px;
    padding: 0 6px; font-size: 11px; }
  .catpanel { margin-top: 8px; padding: 8px 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; }
  .catpanel .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 6px; }
  .clear { cursor: pointer; padding: 4px 10px; border-radius: 999px; font-size: 12px;
    background: transparent; border: 1px dashed var(--border); color: var(--muted); }
  .meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .toplinks { float: right; display: flex; gap: 7px; }
  .toplinks a { font-size: 12px; font-weight: 400; text-decoration: none; padding: 5px 10px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--panel2); color: var(--accent); }
  .toplinks a:hover { border-color: var(--accent); }
  main { padding: 12px 20px 60px; display: block; max-width: 1120px; }
  .library-title { max-width: 1120px; padding: 24px 20px 0; }
  .library-title h2 { margin: 0; font-size: 17px; }
  .library-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  /* compact expandable table rows */
  .rowwrap { margin-bottom: 5px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .prow:hover { border-color: var(--accent); }
  .prow.open { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .prow .caret { color: var(--muted); font-size: 9px; width: 9px; flex-shrink: 0;
    transition: transform .15s; display: inline-block; }
  .prow.open .caret { transform: rotate(90deg); }
  .prow .pthumb { width: 76px; height: 48px; flex-shrink: 0; overflow: hidden;
    border-radius: 6px; border: 1px solid var(--border); background: #0d1117; }
  .prow .pthumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .prow .paper-copy { flex: 1; min-width: 0; }
  .prow .pt { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .prow .ppreview { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px;
    line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .ppreview .why { color: #77d5a7; margin-right: 5px; font-size: 10px; font-weight: 700; }
  .prow .ppreview .pending-label { color: #c4a35a; }
  .prow .pmeta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .prow .pcites { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .prow .pcoll { font-size: 10px; color: var(--accent); white-space: nowrap; padding: 2px 6px;
    border: 1px solid #314765; border-radius: 5px; background: rgba(63,130,190,.07); }
  .pdetail { padding: 12px 14px; border: 1px solid var(--accent); border-top: none;
    border-radius: 0 0 8px 8px; background: var(--panel2); display: flex; gap: 14px; align-items: flex-start; }
  .pdetail .pimg { width: 260px; flex-shrink: 0; }
  .pdetail .pimg img { width: 100%; height: auto; border-radius: 8px; display: block; background: #0d1117; }
  .pdetail .pbody { flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .pdetail .pdesc { font-size: 13px; color: var(--text); line-height: 1.5; }
  .reading-note { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.35fr); gap: 7px; }
  .reading-note > div { padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); font-size: 12px; line-height: 1.45; }
  .reading-note b { display: block; margin-bottom: 2px; color: var(--muted); font-size: 10px;
    text-transform: uppercase; letter-spacing: .045em; }
  .reading-note .novelty { border-color: #355c4a; background: rgba(43,138,91,.09); }
  .reading-note .novelty b { color: #77d5a7; }
  .paper-insight { margin: 1px 0; padding: 10px 12px; border: 1px solid #35536f;
    border-radius: 8px; background: rgba(63,130,190,.08); font-size: 12px; line-height: 1.55; }
  .paper-insight > div + div { margin-top: 5px; }
  .paper-insight b { display: inline-block; min-width: 92px; color: #8bbce8; }
  .paper-insight .delta { color: #bce8cf; }
  .paper-insight .delta b { color: #77d5a7; }
  .paper-insight .basis { margin-top: 7px; color: var(--muted); font-size: 10px; }
  .paper-insight.pending { background: var(--panel); border-color: var(--border); color: var(--muted); }
  .paper-insight.pending b { color: var(--muted); }
  .review-status { display: block; margin-top: 6px; font-size: 10px; color: #c4a35a; }
  @media (max-width: 760px) {
    .reading-note { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    header { padding-left: 12px; padding-right: 12px; }
    .toplinks { float: none; margin-top: 8px; }
    .library-title { padding-left: 12px; padding-right: 12px; }
    main { padding-left: 12px; padding-right: 12px; }
    .pdetail { flex-direction: column; }
    .pdetail .pimg { width: 100%; max-width: 360px; }
    .prow .pthumb { width: 64px; height: 42px; }
    .prow .pcoll, .prow .pcites, .prow .pmeta { display: none; }
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel2);
    color: var(--muted); border: 1px solid var(--border); }
  .badge.coll { color: var(--accent); }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { font-size: 12px; text-decoration: none; padding: 4px 9px; border-radius: 7px;
    border: 1px solid var(--border); color: var(--text); background: var(--panel2); }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  .links a.pdf { background: #2a1f12; }
  .links a.disabled { opacity: .3; pointer-events: none; }
  .ctags { display: flex; gap: 5px; flex-wrap: wrap; }
  .ctag { font-size: 11px; color: var(--muted); cursor: pointer; padding: 1px 6px;
    border-radius: 5px; background: var(--chip); }
  .ctag:hover { color: var(--accent); }
  .ctag.on { background: var(--chipOn); color: #fff; }
  .empty { color: var(--muted); padding: 40px; text-align: center; grid-column: 1/-1; }
  .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.78);
    display: none; flex-direction: column; }
  .modal-bg.open { display: flex; }
  .modal-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .modal-bar .t { flex: 1; font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-bar a, .modal-bar button { font-size: 12px; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    text-decoration: none; cursor: pointer; font-family: inherit; }
  .modal-bar a:hover, .modal-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .modal-bg iframe { flex: 1; width: 100%; border: 0; background: #525659; }
</style>
</head>
<body>
<header>
  <h1>dex-papers <span class="count" id="count"></span>
    <span class="toplinks">
      <a href="overview.html">카드형 overview →</a>
    </span>
  </h1>
  <input class="search" id="search" type="search" placeholder="제목·요약·방법·하드웨어 검색…" autocomplete="off">
  <div class="barlabel">어떤 계열을 볼지 먼저 선택</div>
  <div class="chips" id="collbar"></div>
  <div class="barlabel zonetoggle" id="zoneToggle"><span class="caret">▶</span> <span id="zoneLabel">세부 필터</span> <span class="zonesummary" id="zoneSummary"></span></div>
  <div id="filterZone">
    <div class="barlabel">태그 필터 <span style="text-transform:none">(분류 간 AND · 같은 분류 안 OR)</span></div>
    <div id="filters"></div>
  </div>
  <div class="meta-row"><span class="clear" id="clear">✕ clear filters</span></div>
</header>
<section class="library-title">
  <h2>논문 고르기</h2>
  <p id="reviewCoverage">행을 펼치면 문제, 핵심 아이디어, 기존 연구 대비 차이와 검토 수준을 볼 수 있다.</p>
</section>
<main id="grid"></main>

<div class="modal-bg" id="pdfModal">
  <div class="modal-bar">
    <span class="t" id="pdfTitle"></span>
    <a id="pdfNewTab" href="#" target="_blank" rel="noopener">↗ New tab</a>
    <button id="pdfClose">✕ Close (Esc)</button>
  </div>
  <iframe id="pdfFrame" title="PDF viewer"></iframe>
</div>

<script src="papers.js"></script>
<script src="paper_insights.js"></script>
<script>
  const P = window.PAPERS || [];
  const INSIGHTS = window.PAPER_INSIGHTS || {};
  const activeTags = new Set();
  const activeGroups = new Set();
  let query = "";
  const GROUP_ORDER = [
    "RL & Control",
    "Imitation & Demonstration Learning",
    "Foundation / Generalist Policies",
    "Grasping & Motion Generation",
    "Data / Teleoperation / Task Generation",
    "Benchmarks / Perception / Infrastructure"
  ];
  const GROUP_DESCRIPTIONS = {
    "RL & Control": "reward-driven exploration, curriculum, control",
    "Imitation & Demonstration Learning": "BC, DAgger, diffusion/flow policies, retargeting",
    "Foundation / Generalist Policies": "VLA, pretrained behavior models, cross-task controllers",
    "Grasping & Motion Generation": "grasp synthesis, grasp policies, physically plausible motion",
    "Data / Teleoperation / Task Generation": "datasets, teleoperation, augmentation, autonomous collection",
    "Benchmarks / Perception / Infrastructure": "evaluation, sensing, planning, surveys, systems"
  };
  const GROUP_LABELS = {
    "RL & Control": "RL",
    "Imitation & Demonstration Learning": "IL",
    "Foundation / Generalist Policies": "Foundation",
    "Grasping & Motion Generation": "Grasp/Motion",
    "Data / Teleoperation / Task Generation": "Data/Teleop",
    "Benchmarks / Perception / Infrastructure": "Benchmark/Infra"
  };
  const GROUP_OVERRIDES = {
    "Towards Human-Level Bimanual Dexterous Manipulation with Reinforcement Learning": "Benchmarks / Perception / Infrastructure",
    "PerAct2: Benchmarking and Learning for Robotic Bimanual Manipulation Tasks": "Benchmarks / Perception / Infrastructure",
    "DexH2R: A Benchmark for Dynamic Dexterous Grasping in Human-to-Robot Handover": "Benchmarks / Perception / Infrastructure",
    "DexterityGen: Foundation Controller for Unprecedented Dexterity": "Foundation / Generalist Policies",
    "mimic-one: a Scalable Model Recipe for General Purpose Robot Dexterity": "Foundation / Generalist Policies",
    "RoboCat: A Self-Improving Generalist Agent for Robotic Manipulation": "Foundation / Generalist Policies",
    "ManipTrans: Efficient Dexterous Bimanual Manipulation Transfer via Residual Learning": "RL & Control",
    "DexMachina: Functional Retargeting for Bimanual Dexterous Manipulation": "RL & Control",
    "AsymDex: Asymmetry and Relative Coordinates for RL-based Bimanual Dexterity": "RL & Control",
    "ENPIRE: Agentic Robot Policy Self-Improvement in the Real World": "RL & Control"
  };
  function researchGroupOf(p) {
    if (GROUP_OVERRIDES[p.title]) return GROUP_OVERRIDES[p.title];
    const tags = p.tags || [];
    const lowerTitle = p.title.toLowerCase();
    const has = (...values) => values.some(v => tags.includes(v));
    const hasPart = value => tags.some(t => t.toLowerCase().includes(value));

    if (has("survey", "benchmark", "analysis", "perception", "segmentation", "TAMP"))
      return "Benchmarks / Perception / Infrastructure";
    if (has("dataset", "teleoperation", "crowdsourcing", "mocap", "capture") ||
        (has("data-collection") && !has("RL")))
      return "Data / Teleoperation / Task Generation";
    if (hasPart("grasp") || lowerTitle.includes("grasp"))
      return "Grasping & Motion Generation";
    if (has("VLA", "foundation", "foundation-model", "generalist", "pretraining") ||
        /foundation (model|policy|controller)|generalist|large behavior model/.test(lowerTitle))
      return "Foundation / Generalist Policies";
    if (has("RL"))
      return "RL & Control";
    if (has("imitation-learning", "diffusion", "flow-matching", "one-shot", "human-video"))
      return "Imitation & Demonstration Learning";
    return "Benchmarks / Perception / Infrastructure";
  }
  const READING_NOTES = {
    "Learning Dexterous In-Hand Manipulation": {
      baseline: "Goal-progress reward, success/drop signal, recurrent policy",
      novelty: "대규모 domain randomization과 memory를 이용해 dynamics를 online으로 추론하며 zero-shot sim-to-real."
    },
    "Solving Rubik's Cube with a Robot Hand": {
      baseline: "Goal-state progress, success bonus, drop penalty",
      novelty: "Automatic Domain Randomization과 planner가 제공하는 flip/face-rotation subgoal의 장기 실행."
    },
    "DeXtreme: Transfer of Agile In-hand Manipulation from Simulation to Reality": {
      baseline: "Rotation/position goal, success bonus, action·velocity regularization",
      novelty: "강한 ADR, LSTM, 저비용 Allegro setup을 결합한 재현 가능한 sim-to-real recipe."
    },
    "Visual Dexterity: In-hand Reorientation of Novel and Complex Object Shapes": {
      baseline: "Orientation goal, fingertip proximity, energy·escape penalty",
      novelty: "Table-contact를 벌점으로 만들어 in-air reorientation을 유도하고 state teacher를 depth student로 distill."
    },
    "Twisting Lids Off with Two Hands": {
      baseline: "Twist progress, pose, contact, action·work penalty",
      novelty: "Task 성공에 필요한 fingertip–bottle contact topology를 reference contact point로 직접 인코딩."
    },
    "Sequential Dexterity: Chaining Dexterous Policies for Long-Horizon Manipulation": {
      baseline: "사람이 나눈 subtask와 각 단계의 shaped reward",
      novelty: "다음 policy의 예상 성공 가능성을 현재 policy의 auxiliary reward로 사용하는 backward fine-tuning."
    },
    "DexterityGen: Foundation Controller for Unprecedented Dexterity": {
      baseline: "Object/finger goal, action·torque·work, style reward",
      novelty: "Nearby-grasp goal graph로 대규모 RL 행동 데이터를 만든 뒤 diffusion foundation controller로 distill."
    },
    "ManipTrans: Efficient Dexterous Bimanual Manipulation Transfer via Residual Learning": {
      baseline: "Wrist/finger imitation, object tracking, contact force",
      novelty: "General hand-motion imitator와 task-specific residual을 분리하고 gravity·friction을 실제 값으로 복원."
    },
    "DexMachina: Functional Retargeting for Bimanual Dexterous Manipulation": {
      baseline: "Object state, hand keypoint, joint, contact tracking reward",
      novelty: "Virtual object controller가 긴 trajectory를 먼저 수행하고, reward가 안정되면 조작 책임을 policy에 handoff."
    },
    "AsymDex: Asymmetry and Relative Coordinates for RL-based Bimanual Dexterity": {
      baseline: "Hand distance, task progress, success bonus, action penalty",
      novelty: "Dominant/facilitating hand 역할과 relative state/action으로 탐색 차원을 절반 수준까지 구조적으로 축소."
    }
  };

  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const collbar = document.getElementById("collbar");
  const countEl = document.getElementById("count");
  const zoneToggle = document.getElementById("zoneToggle");
  const filterZone = document.getElementById("filterZone");
  const zoneSummary = document.getElementById("zoneSummary");
  let zoneOpen = false;
  function applyZone() {
    filterZone.classList.toggle("collapsed", !zoneOpen);
    zoneToggle.classList.toggle("open", zoneOpen);
  }
  zoneToggle.onclick = () => { zoneOpen = !zoneOpen; applyZone(); };

  // build href for local PDF: encode each path segment (handles spaces, "?")
  const pdfHref = (f) => f.split("/").map(encodeURIComponent).join("/");
  const arxivIdOf = (p) => {
    const m = (p.arxiv || "").match(/arxiv\.org\/abs\/([^?#]+)/);
    return m ? m[1].replace(/v\d+$/, "") : null;
  };
  function teaserCandidates(p) {
    const sources = [];
    if (p.image) sources.push(p.image);
    const id = arxivIdOf(p);
    if (id) {
      sources.push("https://arxiv.org/html/" + id + "/x1.png");
      sources.push("https://arxiv.org/html/" + id + "/x1.svg");
    }
    return [...new Set(sources)];
  }
  function attachTeaser(img, sources) {
    if (!img || !sources.length) return;
    let index = 0;
    img.src = sources[index];
    img.onerror = () => {
      index += 1;
      if (index < sources.length) img.src = sources[index];
      else img.parentNode.remove();
    };
  }

  // ---- tag taxonomy: group flat tags into categories for a drill-down filter UI ----
  const TAXONOMY = {
    "Lab / Org": ["Apple","Berkeley","Brown","CMU","DeepMind","Google","MIT","Meta","NVIDIA","NYU","OpenAI","PKU","Stanford","TUM","UCSD","USC","UT-Austin","ETH-Zurich"],
    "Method": ["RL","imitation-learning","sim-to-real","teleoperation","shared-autonomy","kinesthetic-teaching","self-supervised","reset-free","reset","TAMP","VLA","VLM","LLM","diffusion","equivariant","flow-matching","one-shot","self-improving","pretraining","augmentation","data-augmentation","multi-task","multi-agent","sample-efficient","data-efficient","agentic","generalist","human-in-the-loop","interactive","retargeting","human-to-robot","compliance","impedance","admittance","force-control","force-feedback","model-based","world-model","MPC","optimization","planning","differentiable-simulation","fine-tuning","transformer","energy-based","compositional","representation-learning"],
    "Topic": ["manipulation","grasping","dexterous","bimanual","in-hand-reorientation","tool-use","long-horizon","contact-rich","contact","non-prehensile","dynamic","whole-body","coordination","data-collection","data-generation","scaling","real-world","autonomous","crowdsourcing","deployment","bottle-cap","valve","door","placing","hand-object","handover","grasp-synthesis","functional-grasp","humanoid","affordance","cross-embodiment","tactile","haptic","industrial","generalization","open-source","deformable-object","articulated-object"],
    "Perception": ["perception","segmentation","foundation","foundation-model","open-vocabulary","gaussian-splatting","video","vision","RGB-D","point-cloud","video-prediction","video-generation","video-planning","visuomotor","mocap","capture","human-video","human-motion","pose-estimation","implicit-representation","language-grounding","geometry","part-aware","object-centric"],
    "Hardware": ["Allegro","Shadow","LEAP","Inspire","D'Claw","parallel-jaw","hardware","tendon-driven","micro-vibration"],
    "Type": ["survey","system","benchmark","analysis","dataset"]
  };
  const CAT_ORDER = ["Lab / Org","Year","Topic","Method","Perception","Hardware","Type"];
  const TAGCAT = {};
  Object.entries(TAXONOMY).forEach(([c,ts]) => ts.forEach(t => TAGCAT[t] = c));
  const catOf = (t) => t.indexOf("year:") === 0 ? "Year" : (TAGCAT[t] || "Other");

  // derive the primary 4-digit year from a venue string
  const yearOf = (p) => { const m = (p.venue||"").match(/(19|20)\d{2}/g); return m ? m[0] : null; };
  P.forEach(p => {
    p._year = yearOf(p);
    p._group = researchGroupOf(p);
  });
  const reviewedCount = P.filter(p =>
    INSIGHTS[p.title] && !INSIGHTS[p.title].basis.includes("검토 전")).length;
  document.getElementById("reviewCoverage").textContent =
    "분류를 고른 뒤 차별점 한 줄을 훑어보세요. 행을 펼치면 상세 비교 · 본문 검토 " + reviewedCount + "편";

  // counts
  const tagCounts = {}, groupCounts = {}, yearCounts = {};
  P.forEach(p => {
    (p.tags || []).forEach(t => tagCounts[t] = (tagCounts[t]||0)+1);
    groupCounts[p._group] = (groupCounts[p._group]||0)+1;
    if (p._year) { const k = "year:"+p._year; yearCounts[k] = (yearCounts[k]||0)+1; }
  });
  Object.assign(tagCounts, yearCounts);
  const allGroups = GROUP_ORDER.filter(g => groupCounts[g]);

  // tags per category (year newest-first; others by count desc)
  const catTags = {};
  CAT_ORDER.forEach(c => {
    catTags[c] = c === "Year"
      ? Object.keys(yearCounts).sort((a,b) => b.localeCompare(a))
      : Object.keys(tagCounts).filter(t => catOf(t) === c)
          .sort((a,b) => tagCounts[b]-tagCounts[a] || a.localeCompare(b));
  });
  const placed = new Set([].concat(...CAT_ORDER.map(c => catTags[c])));
  const otherTags = Object.keys(tagCounts).filter(t => t.indexOf("year:") !== 0 && !placed.has(t))
    .sort((a,b) => tagCounts[b]-tagCounts[a] || a.localeCompare(b));
  if (otherTags.length) { catTags["Other"] = otherTags; CAT_ORDER.push("Other"); }

  const openCats = new Set();   // expanded category panels
  const chipLabel = (t) => t.indexOf("year:") === 0 ? t.slice(5) : t;

  function renderBars() {
    collbar.innerHTML = "";
    allGroups.forEach(c => {
      const el = document.createElement("span");
      el.className = "chip coll" + (activeGroups.has(c) ? " on" : "");
      el.title = c + " · " + GROUP_DESCRIPTIONS[c];
      el.innerHTML = GROUP_LABELS[c] + ' <span class="n">' + groupCounts[c] + '</span>';
      el.onclick = () => { activeGroups.has(c) ? activeGroups.delete(c) : activeGroups.add(c); render(); };
      collbar.appendChild(el);
    });
    filters.innerHTML = "";
    const heads = document.createElement("div");
    heads.className = "catheads";
    filters.appendChild(heads);
    CAT_ORDER.forEach(cat => {
      const tags = catTags[cat]; if (!tags || !tags.length) return;
      const actN = tags.filter(t => activeTags.has(t)).length;
      const open = openCats.has(cat);
      const head = document.createElement("div");
      head.className = "cathead" + (open ? " open" : "");
      head.innerHTML = '<span class="caret">▶</span>' + cat +
        ' <span class="cn">(' + tags.length + ')</span>' +
        (actN ? ' <span class="actN">' + actN + '</span>' : '');
      head.onclick = () => { openCats.has(cat) ? openCats.delete(cat) : openCats.add(cat); render(); };
      heads.appendChild(head);
      if (open) {
        const panel = document.createElement("div");
        panel.className = "catpanel";
        const lbl = document.createElement("div");
        lbl.className = "lbl"; lbl.textContent = cat;
        panel.appendChild(lbl);
        const chips = document.createElement("div");
        chips.className = "chips";
        tags.forEach(t => {
          const el = document.createElement("span");
          el.className = "chip" + (activeTags.has(t) ? " on" : "");
          el.innerHTML = chipLabel(t) + ' <span class="n">' + tagCounts[t] + '</span>';
          el.onclick = () => toggleTag(t);
          chips.appendChild(el);
        });
        panel.appendChild(chips);
        filters.appendChild(panel);
      }
    });
  }

  function toggleTag(t) { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); render(); }

  function match(p) {
    if (activeGroups.size && !activeGroups.has(p._group)) return false;
    // AND across categories, OR within a category
    const groups = {};
    for (const t of activeTags) { const c = catOf(t); (groups[c] = groups[c] || []).push(t); }
    for (const c in groups) {
      let ok = false;
      for (const t of groups[c]) {
        if (c === "Year") { if (t === "year:"+(p._year||"")) { ok = true; break; } }
        else if ((p.tags||[]).includes(t)) { ok = true; break; }
      }
      if (!ok) return false;
    }
    if (query) {
      const insight = INSIGHTS[p.title] || {};
      const hay = (p.title + " " + (p.desc||"") + " " + (insight.problem||"") + " " +
        (insight.idea||"") + " " + (insight.delta||"") + " " + p._group + " " +
        (p.tags||[]).join(" ") + " " + (p.venue||"") + " " + (p.collection||"")).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  }

  function linkEl(label, href, cls) {
    if (href) return '<a class="'+cls+'" href="'+href+'" target="_blank" rel="noopener">'+label+'</a>';
    return '<a class="'+cls+' disabled">'+label+'</a>';
  }

  function render() {
    renderBars();
    const nActive = activeTags.size + activeGroups.size;
    zoneSummary.textContent = nActive ? "· " + nActive + " active" : "";
    const list = P.filter(match);
    countEl.textContent = "· " + list.length + " / " + P.length;
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="empty">No papers match.</div>'; return; }
    list.forEach(p => {
      const wrap = document.createElement("div");
      wrap.className = "rowwrap";
      const row = document.createElement("div");
      row.className = "prow";
      const insight = INSIGHTS[p.title];
      const preview = insight ? insight.delta : (p.desc || "요약 검토 대기");
      const reviewed = insight && !insight.basis.includes("검토 전");
      const teaserSources = teaserCandidates(p);
      row.innerHTML =
        '<span class="caret">▶</span>' +
        (teaserSources.length ? '<span class="pthumb"><img class="teaser" loading="lazy" alt=""></span>' : '') +
        '<span class="paper-copy"><span class="pt">'+p.title+'</span>' +
          '<span class="ppreview"><span class="why'+(reviewed ? '' : ' pending-label')+'">' +
            (reviewed ? '차별점' : '한줄')+'</span>'+preview+'</span></span>' +
        (p.venue ? '<span class="pmeta">'+p.venue+'</span>' : '') +
        (p.cites != null ? '<span class="pcites">'+p.cites+' cit</span>' : '') +
        '<span class="pcoll">'+GROUP_LABELS[p._group]+'</span>';

      const detail = document.createElement("div");
      detail.className = "pdetail";
      detail.hidden = true;
      const tags = (p.tags||[]).map(t =>
        '<span class="ctag'+(activeTags.has(t)?' on':'')+'" data-tag="'+t+'">'+t+'</span>').join("");
      const reading = READING_NOTES[p.title];
      const insightHtml = insight
        ? '<div class="paper-insight'+(insight.basis.includes("검토 전") ? ' pending' : '')+'">' +
            '<div><b>문제</b>'+insight.problem+'</div>' +
            '<div><b>핵심 아이디어</b>'+insight.idea+'</div>' +
            '<div class="delta"><b>기존 대비 차이</b>'+insight.delta+'</div>' +
            '<div class="basis">검토 근거 · '+insight.basis+'</div>' +
          '</div>'
        : p.desc
          ? '<div class="paper-insight pending"><div><b>핵심 아이디어</b>'+p.desc+'</div>' +
              '<span class="review-status">초록 기반 요약 · Introduction/Related Work 비교 검토 전</span></div>'
          : '<div class="paper-insight pending">본문 검토 대기</div>';
      detail.innerHTML =
        (teaserSources.length ? '<div class="pimg"><img class="teaser" loading="lazy" alt=""></div>' : '') +
        '<div class="pbody">' +
          insightHtml +
          (reading ? '<div class="reading-note">' +
            '<div><b>공통 기반</b>'+reading.baseline+'</div>' +
            '<div class="novelty"><b>실제 차별점</b>'+reading.novelty+'</div>' +
          '</div>' : '') +
          '<div class="ctags">'+tags+'</div>' +
          '<div class="links">' +
            (p.summary ? '<a href="'+p.summary+'">📄 Summary</a>' : '') +
            (p.file ? '<a class="pdf" href="'+pdfHref(p.file)+'" data-pdf="1">PDF</a>'
                    : '<a class="pdf disabled">PDF</a>') +
            linkEl("arXiv", p.arxiv, "") +
            linkEl("Project", p.project, "") +
          '</div>' +
        '</div>';
      attachTeaser(row.querySelector("img.teaser"), teaserSources);

      row.onclick = () => {
        const willOpen = detail.hidden;
        if (willOpen && !detail.dataset.teaserLoaded) {
          attachTeaser(detail.querySelector("img.teaser"), teaserSources);
          detail.dataset.teaserLoaded = "1";
        }
        detail.hidden = !willOpen;
        row.classList.toggle("open", willOpen);
      };
      detail.querySelectorAll(".ctag").forEach(e =>
        e.onclick = () => toggleTag(e.dataset.tag));
      detail.querySelectorAll("a.pdf[data-pdf]").forEach(a =>
        a.onclick = (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // let new-tab work
          e.preventDefault();
          openPdf(a.getAttribute("href"), p.title);
        });
      wrap.appendChild(row);
      wrap.appendChild(detail);
      grid.appendChild(wrap);
    });
  }

  document.getElementById("search").addEventListener("input", e => {
    query = e.target.value.trim().toLowerCase(); render();
  });
  document.getElementById("clear").onclick = () => {
    activeTags.clear(); activeGroups.clear(); query = "";
    document.getElementById("search").value = ""; render();
  };

  // in-page PDF viewer (works from file:// — iframe is a same-origin subresource, not a fetch)
  const pdfModal = document.getElementById("pdfModal");
  const pdfFrame = document.getElementById("pdfFrame");
  const pdfTitle = document.getElementById("pdfTitle");
  const pdfNewTab = document.getElementById("pdfNewTab");
  function openPdf(href, title) {
    pdfFrame.src = href;
    pdfTitle.textContent = title;
    pdfNewTab.href = href;
    pdfModal.classList.add("open");
  }
  function closePdf() { pdfModal.classList.remove("open"); pdfFrame.src = "about:blank"; }
  document.getElementById("pdfClose").onclick = closePdf;
  pdfModal.addEventListener("click", e => { if (e.target === pdfModal) closePdf(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && pdfModal.classList.contains("open")) closePdf();
  });

  applyZone();
  render();
</script>
</body>
</html>
